name: dreamcast

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    # Pinned by digest: the :15.0.0-lra tag is mutable and has already been
    # rebuilt from GCC 15 to GCC 17.0.0 (20260630). A floating compiler
    # silently changes which workarounds apply, such as the -ffp-contract=off
    # guard CMakeLists.txt limits to GCC < 16 for src/background.cpp.
    container: pcercuei/dreamcast-toolchain@sha256:0de7d87311717225021374f1afc0f69c6efa4df64f9e31efc415083b3e458d15

    steps:
    - uses: actions/checkout@v6

    # Pin to the SDK pair in docs/docker-dreamcast.md. Unpinned KOS HEAD
    # dropped `uint16`, which this kos-ports libjpeg still uses.
    - uses: actions/checkout@v6
      with:
        repository: KallistiOS/KallistiOS
        ref: 804b3195ebd1a06a27cc2b3a5eacf7a2429040a3
        path: kos

    - uses: actions/checkout@v6
      with:
        repository: pcercuei/kos-ports
        ref: f4faacc42faaf552625777b7709e871a827e1055
        path: kos-ports

    - name: install-dependencies
      run: |
        apk --update add --no-cache coreutils cmake
        mkdir -p /opt/toolchains/dc/bin

    - name: build KallistiOS
      run: |
        cp kos/doc/environ.sh.sample kos/environ.sh
        sed -i "s|KOS_BASE=.*$|KOS_BASE=${GITHUB_WORKSPACE}/kos|" kos/environ.sh
        sed -i 's/-O2/-O3 -fno-PIC -freorder-blocks-algorithm=simple -fipa-cp-clone -flto=auto -ffat-lto-objects -DNDEBUG/' kos/environ.sh

        . kos/environ.sh
        make -C "$KOS_BASE"

    - name: build kos-ports
      run: |
        . kos/environ.sh
        make -C "$KOS_PORTS/libtsunami" install

    - name: build Bloom
      run: |
        . kos/environ.sh
        kos-cmake -DCMAKE_BUILD_TYPE=Release -DWITH_EMBEDDED_BIOS_PATH= .
        cmake --build . -j"$(nproc)"
